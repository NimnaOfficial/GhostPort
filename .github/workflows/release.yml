name: GhostPort Release Factory

# Trigger on every push to main
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Compile for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    # Step A: Checkout source
    - name: 📥 Checkout Source Code
      uses: actions/checkout@v4

    # Step B: Configure CMake with vcpkg
    - name: ⚙️ Configure CMake & vcpkg
      run: |
        cmake -B build -S . \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_BUILD_TYPE=Release
      shell: bash

    # Step C: Build
    - name: 🔨 Compile GhostPort Engine
      run: cmake --build build --config Release

    # Step D: Rename binary to ghostport / ghostport.exe for consistency
    - name: 🏷️ Rename binary (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        mkdir -p dist
        cp build/shadow dist/ghostport
        chmod +x dist/ghostport
      shell: bash

    - name: 🏷️ Rename binary (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir dist
        copy build\Release\shadow.exe dist\ghostport.exe
      shell: cmd

    # Step E: Upload artifacts
    - name: 📦 Upload Compiled Binaries
      uses: actions/upload-artifact@v4
      with:
        name: GhostPort-${{ matrix.os }}
        path: dist/
        if-no-files-found: error
